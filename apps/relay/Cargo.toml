[package]
name = "relay"
version = "0.15.0"
edition = "2024"
build="build.rs"

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = { workspace = true }
tokio = { version = "1.53", features = ["full"] }
serde_json = "1.0.151"
bytes = "1.12.1"
moqtail = { version = "*", path = "../../libs/moqtail-rs" }
moqtail-ssts = { version = "*", path = "../../libs/moqtail-ssts" }
clap = { version = "4.6.7", features = ["derive"] }
tracing-appender = "0.2"
once_cell = "1.21.4"
moka = { version = "0.12", features = ["future"] }
fnv = "1.0.7"
hex = "0.4"
socket2 = "0.6"
