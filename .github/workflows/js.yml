name: JavaScript Checks

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: js-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if any JavaScript files have changed
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: libs/moqtail-ts/**

  build-and-test:
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        job: [build, format, test]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ${{ matrix.job }}
        run: npm run ${{ matrix.job }}

  aggregate:
    name: Build and Test JavaScript
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !cancelled() }}
    steps:
      - name: All checks have passed
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: |
          echo "All JavaScript checks have passed successfully."
          exit 0

      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Some JavaScript checks failed. Please review the logs above."
          exit 1
