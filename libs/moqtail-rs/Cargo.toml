[package]
name = "moqtail"
description = "Draft 22-compliant Media-over-QUIC (MoQ) protocol library."
keywords = ["moq", "quic", "media", "protocol"]
repository = "https://github.com/moqtail/moqtail"
homepage = "https://moqtail.dev"
version = "0.19.0"
edition = "2024"
license = "Apache-2.0"

# TODO: Enable doctest
[lib]
doctest = false

[dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
wtransport.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# moq-dev's QMux implementation, used only as an interop peer in tests.
qmux = { version = "0.6", default-features = false, features = ["ws"] }
web-transport-trait = "0.5"
