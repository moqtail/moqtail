[workspace]
members = ["apps/relay", "apps/relay-api", "apps/client", "libs/moqtail-rs", "libs/moqtail-ssts", "libs/relay-hooks"]
exclude = ["vendor/wtransport"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["yaml"] }
fnv = "1.0.7"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
humantime-serde = "1.1.1"
moqtail = { version = "*", path = "libs/moqtail-rs" }
moqtail-ssts = { version = "*", path = "libs/moqtail-ssts" }
moka = { version = "0.12", features = ["future"] }
once_cell = "1.21.4"
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smart-default = "0.7.1"
socket2 = "0.6"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
wtransport = { version = "0.7.2", features = ["quinn"] }
# wtransport 0.7.2 with Connection::close_session, which sends the
# CLOSE_WEBTRANSPORT_SESSION capsule so browsers see the session error code.
# Only the relay calls it; the published moqtail crate builds against crates.io.
[patch.crates-io]
wtransport = { path = "vendor/wtransport" }
