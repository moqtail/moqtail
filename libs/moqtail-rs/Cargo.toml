[package]
name = "moqtail"
description = "Draft 18-compliant Media-over-QUIC (MoQ) protocol library."
keywords = ["moq", "quic", "media", "protocol"]
repository = "https://github.com/moqtail/moqtail"
homepage = "https://moqtail.dev"
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"

# TODO: Enable doctest
[lib]
doctest = false

[dependencies]
bytes = "1.12.1"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0.21"
wtransport = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
