[package]
name = "relay"
version = "0.18.0"
edition = "2024"
build="build.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wtransport = { workspace = true, features = ["dangerous-configuration"] }
# quinn's packet-level qlog; the relay turns it on in debug builds only.
quinn = { version = "0.11", default-features = false, features = ["qlog"] }
tokio.workspace = true
serde_json.workspace = true
bytes.workspace = true
moqtail.workspace = true
moqtail-ssts.workspace = true
clap.workspace = true
once_cell.workspace = true
moka.workspace = true
fnv.workspace = true
hex.workspace = true
socket2.workspace = true
figment.workspace = true
serde.workspace = true
smart-default.workspace = true
validator.workspace = true
humantime-serde.workspace = true
